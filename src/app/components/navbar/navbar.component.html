<header class="navbar glass">
  <div class="container navbar-inner">
    <a routerLink="/" class="brand">
      <img src="https://ui-avatars.com/api/?name=FreshMart&background=4CAF50&color=fff&rounded=true&size=128" alt="FreshMart Logo" class="logo" />
      <span>FreshMart</span>
    </a>
    <nav class="nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
      <a routerLink="/shop" routerLinkActive="active">Shop</a>
      <a routerLink="/about-us" routerLinkActive="active">About Us</a>
      <a routerLink="/contact-us" routerLinkActive="active">Contact</a>
    </nav>
    <div class="nav-actions">
      <button class="icon-btn search-btn" aria-label="Search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </button>
      <button class="icon-btn cart-btn" aria-label="Cart">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        <span class="cart-count">0</span>
      </button>
    </div>
  </div>
</header>
